[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melody-notation"
version = "0.5.10"
description = "Editable numbered notation, multitrack arrangements, drum sequencer, MIDI/audio/PNG, and Codex/DeepSeek Harness MCP tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "pretty_midi>=0.2.10,<0.3", "soundfile>=0.12", "Send2Trash>=1.8,<2"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
vision = ["openai>=1.50"]
preview = ["sounddevice>=0.5"]
gui = ["PySide6>=6.7,<7", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "sounddevice>=0.5,<1"]
all = ["mcp>=2,<3", "openai>=1.50", "PySide6>=6.7,<7", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "sounddevice>=0.5,<1"]
test = ["pytest>=8"]

[project.scripts]
melody-notation = "melody_notation.cli:main"

# Physical source directory is src/, while existing Python imports stay stable.
[tool.setuptools]
packages = ["melody_notation", "melody_notation.harmony"]

[tool.setuptools.package-dir]
"melody_notation" = "src"

[tool.setuptools.package-data]
"melody_notation" = ["samples/*.jianpu"]
"melody_notation.harmony" = ["*.md", "*.json"]
